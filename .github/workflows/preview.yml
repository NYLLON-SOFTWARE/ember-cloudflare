name: Preview

# Deploys main to a Worker named ember-production on the account's workers.dev subdomain, then checks
# it end to end. It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets and
# skips without them, so forks don't try to deploy. A new Worker takes its setup token from an
# EMBER_SETUP_TOKEN repository secret, if there is one (`openssl rand -hex 32`), since this log may be
# public and the deploy prints no token into it; without one, nobody can set the Worker up until a
# deploy from a terminal, or `wrangler secret put EMBER_SETUP_TOKEN`, gives it a token.
# EMBER_SETUP_NAME_PLACEHOLDER and EMBER_SETUP_EMAIL_PLACEHOLDER repository variables, if set, are the
# name and email address its Set up Ember form suggests in place of Kevin Rose's. MEMBERFUL_URL,
# MEMBERFUL_CLIENT_ID and MEMBERFUL_CLIENT_SECRET repository secrets, if set, are a Memberful custom
# app's keys, which go up with each deploy so its members can sign in once an administrator turns that on,
# and MEMBERFUL_API_KEY and MEMBERFUL_WEBHOOK_SECRET the app's API key and its site's webhook secret,
# with which Ember hears when a membership lapses. TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY
# repository secrets, if set, are a Turnstile widget's keys, with which open sign-up checks that
# whoever signs up is a person.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A push while one runs waits for it rather than cancelling it mid-upload.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No preview: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy one."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      WORKER_NAME: ember-production
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Pinned to commits, not tags, because this job holds the Cloudflare token: a moved tag
      # can't change what runs before the deploy step. These are the commits v4 pointed at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        id: deploy
        env:
          # Only this step sees the token and the secrets, not the install or build scripts.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: the setup token for a Worker that has none yet, which its setup link carries.
          EMBER_SETUP_TOKEN: ${{ secrets.EMBER_SETUP_TOKEN }}
          # Optional: a Memberful custom app's keys, for its members to sign in, and what hearing its
          # site's webhooks takes, for lapsed members to be signed out.
          MEMBERFUL_URL: ${{ secrets.MEMBERFUL_URL }}
          MEMBERFUL_CLIENT_ID: ${{ secrets.MEMBERFUL_CLIENT_ID }}
          MEMBERFUL_CLIENT_SECRET: ${{ secrets.MEMBERFUL_CLIENT_SECRET }}
          MEMBERFUL_API_KEY: ${{ secrets.MEMBERFUL_API_KEY }}
          MEMBERFUL_WEBHOOK_SECRET: ${{ secrets.MEMBERFUL_WEBHOOK_SECRET }}
          # Optional: a Turnstile widget's keys, for open sign-up to check that whoever signs up is a person.
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          # Optional, and not secret: what the setup form suggests.
          EMBER_SETUP_NAME_PLACEHOLDER: ${{ vars.EMBER_SETUP_NAME_PLACEHOLDER }}
          EMBER_SETUP_EMAIL_PLACEHOLDER: ${{ vars.EMBER_SETUP_EMAIL_PLACEHOLDER }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          # Its version, under the sign-in page's help contact, is the commit it deploys. The setup
          # form's placeholders go up only when the repository's variables set them.
          vars=(--var "GIT_REVISION:${GITHUB_SHA::7}")
          for name in EMBER_SETUP_NAME_PLACEHOLDER EMBER_SETUP_EMAIL_PLACEHOLDER; do
            if [ -n "${!name}" ]; then vars+=(--var "$name:${!name}"); fi
          done
          # The deploy script adds the secrets the Worker doesn't have yet with its code, as it does
          # for Deploy to Cloudflare, so no version runs without them, and the Memberful keys given.
          node apps/worker/scripts/deploy.ts --name "$WORKER_NAME" "${vars[@]}"
          url=$(jq -rn 'first(inputs | select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev")))' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler deployed $WORKER_NAME without a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: node apps/worker/scripts/check-deploy.ts "$PREVIEW_URL"
