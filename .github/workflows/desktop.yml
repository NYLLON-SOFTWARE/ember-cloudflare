name: Desktop

# The desktop app (apps/desktop), which installs and builds apart from Ember's workspace: type-checked,
# tested and packaged on macOS, Windows and Linux whenever it changes, with each system's packages kept
# for a week. They aren't signed yet (apps/desktop/README.md says how to open them).
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      # The flame its pages show.
      - apps/web/public/ember-icon.png
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - apps/web/public/ember-icon.png
      - .github/workflows/desktop.yml

# It only reads the repository, so its token can only read it.
permissions:
  contents: read

# A newer push to a pull request stops the run of the one before.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only in Ember's own repository and on pull requests to it, as CI's jobs.
  desktop:
    if: github.repository == 'NYLLON-SOFTWARE/ember-cloudflare'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Let Electron's sandbox start
        # Ubuntu 24.04 keeps programs from making the user namespaces Chromium's sandbox starts in.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test:app; else pnpm test:app; fi
      # What each failed test's pages held as it failed (error-context.md), to read a failure on CI.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ember-desktop-test-results-${{ runner.os }}
          path: apps/desktop/test-results
          retention-days: 7
      - name: Use Xcode 26, whose actool compiles the Mac app's icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -iv beta | sort -V | tail -1)
          test -n "$xcode" || { echo "This runner has no Xcode 26"; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: Package it
        shell: bash
        # Unsigned for now. A Mac's is signed ad hoc, without the hardened runtime that needs a real
        # signature, since an Apple silicon Mac opens no app that's unsigned. electron-builder signs
        # nothing for a pull request unless told to, to keep a real signature's secrets from one, and
        # an ad hoc signature has none. A Mac's leaves its sign-ins unencrypted, too: macOS gives the
        # keychain's key for them, without asking, only to the build that saved it, and to macOS each
        # ad hoc build is another app, so it would ask for the keychain's password as each one starts.
        env:
          CSC_FOR_PULL_REQUEST: true
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm package -c.mac.identity=- -c.mac.hardenedRuntime=false -c.electronFuses.enableCookieEncryption=false
          else
            pnpm package
          fi
      # TEMPORARY, while the new icon is checked: the Mac's icon as actool compiled it and ictool draws it.
      - name: Draw the Mac icon in each appearance
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p icon-check
          sw_vers; xcodebuild -version; actool --version
          resources=$(ls -d release/mac*/Ember.app/Contents/Resources | head -1)
          echo "Resources: $resources"; ls -la "$resources" | head -40
          plutil -p "$resources/../Info.plist" | grep -i icon || true
          cp "$resources/icon.icns" "$resources/Assets.car" icon-check/ || true
          xcrun assetutil --info "$resources/Assets.car" > icon-check/assets.json || true
          cp -R build/icon.icon icon-check/Icon.icon
          mkdir -p icon-check/actool
          actool icon-check/Icon.icon --compile icon-check/actool --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist icon-check/actool/info.plist --app-icon Icon --include-all-app-icons \
            --target-device mac --minimum-deployment-target 26.0 --platform macosx || true
          ictool="$DEVELOPER_DIR/../Applications/Icon Composer.app/Contents/Executables/ictool"
          test -x "$ictool" || ictool=$(find "$DEVELOPER_DIR/.." -path '*Icon Composer.app/*' -name ictool -type f 2>/dev/null | head -1)
          echo "ictool: $ictool"
          "$ictool" -h 2>&1 | head -80 || true
          for rendition in Default Light Dark TintedLight TintedDark ClearLight ClearDark; do
            "$ictool" icon-check/Icon.icon --export-preview macOS "$rendition" 512 512 1 -45 "icon-check/render-$rendition.png" 2>&1 | tail -5 \
              || "$ictool" icon-check/Icon.icon --export-preview macOS "$rendition" 512 512 1 "icon-check/render-$rendition.png" 2>&1 | tail -5 || true
          done
          rm -rf icon-check/Icon.icon
          ls -laR icon-check
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: ember-desktop-icon-check
          path: apps/desktop/icon-check
          retention-days: 2
      - uses: actions/upload-artifact@v6
        with:
          name: ember-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
