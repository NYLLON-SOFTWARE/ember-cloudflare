name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repository, so their token can only read it.
permissions:
  contents: read

# Both jobs run only in Ember's own repository and on pull requests to it: the copies Deploy to
# Cloudflare makes of it skip them, so they don't spend their owners' Actions minutes.
jobs:
  check:
    if: github.repository == 'NYLLON-SOFTWARE/ember-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Released migrations stay as they are
        # Deployments apply each migration once, by name, so a change to a released one would reach
        # only new deployments, never those that update: a schema change goes in a new migration.
        run: |
          # Apart from a pipe, so a failed lookup fails the step rather than reading as no releases.
          releases=$(git ls-remote --tags --refs --sort=-v:refname origin 'refs/tags/v*')
          release=$(echo "$releases" | head -n 1 | cut -f 2)
          if [ -z "$release" ]; then exit 0; fi
          git fetch --quiet --no-tags --depth=1 origin "+$release:$release"
          changed=$(git diff --name-only --no-renames --diff-filter=DMT "$release" HEAD -- apps/worker/migrations apps/worker/search-migrations)
          if [ -n "$changed" ]; then
            echo "::error::${release#refs/tags/} released these migrations, so they can't change; add a new one instead:" $changed
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: github.repository == 'NYLLON-SOFTWARE/ember-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ember/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
