<!DOCTYPE html>
<html lang="en">

<head>
  <title>We can’t find that (404) · Team Lopez</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url("/fonts/team-lopez.css");
    *, *::before, *::after { box-sizing: border-box; }
    body {
      --color-border: #d9d9d9;
      --color-bg: #f2eee2;
      --color-text: #000;
      --btn-size: 2.65em;
      background-color: var(--color-bg);
      block-size: 100dvh;
      color: var(--color-text);
      display: grid;
      align-content: center;
      margin: 0;
      padding: 0;
      place-items: center;
      font-family: "Nunito Sans", Avenir, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { --color-border: #333; --color-bg: #1a1a1a; --color-text: #fff; }
    }
    .rise {
      position: absolute;
      top: 28px;
      left: -8%;
      right: -8%;
      height: 3px;
      background: #b5a169;
      transform: rotate(-5deg);
      transform-origin: left center;
    }
    .lockup { display: block; width: min(320px, calc(100% - 48px)); height: auto; margin: 0 auto 1.5rem; }
    svg { color: var(--color-text); }
    .error {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 2em;
      justify-content: start;
      margin-block-end: 15dvh;
    }
    .error__img {
      aspect-ratio: 1;
      background-color: #000;
      block-size: auto;
      display: grid;
      place-items: center;
      inline-size: min(30dvh, 220px);
    }
    .error__img svg { color: #c6b684; grid-area: 1/1; max-inline-size: 66%; }
    .buttons { display: flex; flex-direction: row; gap: 1em; justify-content: center; }
    .btn {
      align-items: center;
      aspect-ratio: 1;
      background-color: #b5a169;
      block-size: var(--btn-size);
      border: 0;
      color: #000;
      cursor: pointer;
      display: grid;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      gap: 0.5em;
      inline-size: var(--btn-size);
      justify-content: center;
      padding: 0;
      place-items: center;
      text-align: center;
      text-decoration: none;
    }
    .btn svg { color: #000; grid-area: 1/1; inline-size: 1.3em; max-inline-size: unset; }
    .for-screen-reader {
      clip-path: inset(50%);
      height: 1px;
      width: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
    }

  </style>
</head>

<body>
  <div class="rise" aria-hidden="true"></div>
  <img class="lockup" src="/logos/victor-lopez-logo-wide.png" alt="Victor Lopez for Hammond City Council" width="640" height="240">
  <div class="error">
    <div class="error__img">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Not found">
        <path d="M5 7H6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17.7143V6.28571C2 5.02335 2.99492 4 4.22222 4H19.7778C21.0051 4 22 5.02335 22 6.28571V17.7143C22 18.9767 21.0051 20 19.7778 20H4.22222C2.99492 20 2 18.9767 2 17.7143Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 14L12 12M12 12L14 10M12 12L10 10M12 12L14 14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <a href="/" class="btn" autofocus="true">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12L3 12M3 12L11.5 3.5M3 12L11.5 20.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="for-screen-reader">Go back</span>
    </a>
  </div>
</body>

</html>
