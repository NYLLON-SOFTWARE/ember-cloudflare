<!DOCTYPE html>
<html lang="en">
  <head>
    <title>That didn’t work (422)</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        --lch-black: 0% 0 0;
        --lch-gray: 75% 0.005 96;
        --lch-white: 100% 0 0;

        --color-border: oklch(var(--lch-gray));
        --color-bg: oklch(var(--lch-white));
        --color-text: oklch(var(--lch-black));

        --btn-size: 2.65em;

        background-color: var(--color-bg);
        block-size: 100dvh;
        color: var(--color-text);
        display: grid;
        margin: 0;
        padding: 0;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";

        @media (prefers-color-scheme: dark) {
          --lch-black: 100% 0 0;
          --lch-gray: 44.95% 0 0;
          --lch-white: 0% 0 0;
        }
      }

      svg {
        color: var(--color-text);

        @media (prefers-color-scheme: dark) {
          color: var(--color-text);
        }
      }

      .error {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 2em;
        justify-content: start;
        margin-block-end: 15dvh;
      }

      .error__img {
        aspect-ratio: 1;
        background-color: var(--color-text);
        block-size: auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        inline-size: 30dvh;

        svg {
          color: var(--color-bg);
          grid-area: 1/1;
          max-inline-size: 66%;

          @media (prefers-color-scheme: dark) {
            color: var(--color-bg);
          }
        }
      }

      .buttons {
        display: flex;
        flex-direction: row;
        gap: 1em;
        justify-content: center;
      }

      .btn {
        align-items: center;
        aspect-ratio: 1;
        background-color: var(--color-bg);
        block-size: var(--btn-size);
        border-radius: 50%;
        border: 1px solid var(--color-border);
        color: var(--color-text);
        cursor: pointer;
        display: grid;
        font-weight: 600;
        font-size: 1.4rem;
        gap: 0.5em;
        inline-size: var(--btn-size);
        justify-content: center;
        padding: 0;
        place-items: center;
        text-align: center;

        svg {
          -webkit-touch-callout: none;
          grid-area: 1/1;
          inline-size: 1.3em;
          max-inline-size: unset;
          user-select: none;
        }
      }

      .for-screen-reader {
        clip-path: inset(50%);
        height: 1px;
        width: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <div class="error">
      <div class="error__img">
        <svg stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="That didn’t work">
          <path d="M12 7L12 13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17.01L12.01 16.9989" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="buttons">
        <a href="/" class="btn" autofocus="true">
          <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12L3 12M3 12L11.5 3.5M3 12L11.5 20.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="for-screen-reader">Go back</span>
        </a>
        <!-- Campfire's reloads with an inline onclick, which Ember's Content-Security-Policy refuses;
             an empty href loads the same address again. -->
        <a href="" class="btn" autofocus="true">
          <svg stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.1679 8C19.6247 4.46819 16.1006 2 11.9999 2C6.81459 2 2.55104 5.94668 2.04932 11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.88146 16C4.42458 19.5318 7.94874 22 12.0494 22C17.2347 22 21.4983 18.0533 22 13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7.04932 16H2.64932C2.31795 16 2.04932 16.2686 2.04932 16.6V21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="for-screen-reader">Try again</span>
        </a>
      </div>
    </div>
  </body>
</html>
