<!DOCTYPE html>
<html lang="en">
  <head>
    <title>That didn’t work (422) · Team Lopez</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
    @import url("/fonts/team-lopez.css");
    *, *::before, *::after { box-sizing: border-box; }
    body {
      --color-border: #d9d9d9;
      --color-bg: #f2eee2;
      --color-text: #000;
      --btn-size: 2.65em;
      background-color: var(--color-bg);
      block-size: 100dvh;
      color: var(--color-text);
      display: grid;
      align-content: center;
      margin: 0;
      padding: 0;
      place-items: center;
      font-family: "Nunito Sans", Avenir, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { --color-border: #333; --color-bg: #1a1a1a; --color-text: #fff; }
    }
    .rise {
      position: absolute;
      top: 28px;
      left: -8%;
      right: -8%;
      height: 3px;
      background: #b5a169;
      transform: rotate(-5deg);
      transform-origin: left center;
    }
    .lockup { display: block; width: min(320px, calc(100% - 48px)); height: auto; margin: 0 auto 1.5rem; }
    svg { color: var(--color-text); }
    .error {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 2em;
      justify-content: start;
      margin-block-end: 15dvh;
    }
    .error__img {
      aspect-ratio: 1;
      background-color: #000;
      block-size: auto;
      display: grid;
      place-items: center;
      inline-size: min(30dvh, 220px);
    }
    .error__img svg { color: #c6b684; grid-area: 1/1; max-inline-size: 66%; }
    .buttons { display: flex; flex-direction: row; gap: 1em; justify-content: center; }
    .btn {
      align-items: center;
      aspect-ratio: 1;
      background-color: #b5a169;
      block-size: var(--btn-size);
      border: 0;
      color: #000;
      cursor: pointer;
      display: grid;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      gap: 0.5em;
      inline-size: var(--btn-size);
      justify-content: center;
      padding: 0;
      place-items: center;
      text-align: center;
      text-decoration: none;
    }
    .btn svg { color: #000; grid-area: 1/1; inline-size: 1.3em; max-inline-size: unset; }
    .for-screen-reader {
      clip-path: inset(50%);
      height: 1px;
      width: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
    }

  </style>
  </head>

  <body>
    <div class="rise" aria-hidden="true"></div>
  <img class="lockup" src="/logos/victor-lopez-logo-wide.png" alt="Victor Lopez for Hammond City Council" width="640" height="240">
  <div class="error">
      <div class="error__img">
        <svg stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="That didn’t work">
          <path d="M12 7L12 13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17.01L12.01 16.9989" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="buttons">
        <a href="/" class="btn" autofocus="true">
          <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12L3 12M3 12L11.5 3.5M3 12L11.5 20.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="for-screen-reader">Go back</span>
        </a>
        <!-- Campfire's reloads with an inline onclick, which Ember's Content-Security-Policy refuses;
             an empty href loads the same address again. -->
        <a href="" class="btn" autofocus="true">
          <svg stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.1679 8C19.6247 4.46819 16.1006 2 11.9999 2C6.81459 2 2.55104 5.94668 2.04932 11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.88146 16C4.42458 19.5318 7.94874 22 12.0494 22C17.2347 22 21.4983 18.0533 22 13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7.04932 16H2.64932C2.31795 16 2.04932 16.2686 2.04932 16.6V21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="for-screen-reader">Try again</span>
        </a>
      </div>
    </div>
  </body>
</html>
