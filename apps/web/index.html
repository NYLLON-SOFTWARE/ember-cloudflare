<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- As in ember-rust's layouts/application.html. viewport-fit=cover runs the page under the notch
         (the layout pads with env(safe-area-inset-*)), and resizes-content makes Android shrink the
         page above the on-screen keyboard instead of covering the composer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="48x48" href="/logos/app-icon-48.png" />
    <link rel="apple-touch-icon" href="/logos/app-icon.png" />
    <title>Ember</title>
    <script>
      // Apply the saved appearance before first paint, as ember-rust's theme-init.js does.
      (function () {
        var saved;
        try { saved = localStorage.getItem("ember:appearance"); } catch (e) {}
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
