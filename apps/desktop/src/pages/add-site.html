<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add a Site</title>
    <link rel="stylesheet" href="page.css" />
    <script type="module" src="add-site.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="ember-icon.png" alt="" width="48" height="48" />
        <h1>Add an Ember site</h1>
        <p>Type the address you open Ember at in your browser.</p>
      </header>
      <form novalidate>
        <p id="problem" class="problem" role="alert" hidden></p>
        <div class="field">
          <label for="address">Site address</label>
          <input id="address" name="address" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="chat.example.com" autofocus />
        </div>
        <button type="submit">Add site</button>
      </form>
    </main>
  </body>
</html>
